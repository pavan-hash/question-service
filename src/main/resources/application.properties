spring.application.name=question-service-v3
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
resilience4j.ratelimiter.instances.question-service.limit-for-period=2
resilience4j.ratelimiter.instances.question-service.limit-refresh-period=60s
resilience4j.ratelimiter.instances.question-service.timeout-duration=500ms
eureka.client.service-url.defaultZone=${EUREKA_URL}
spring.jpa.hibernate.ddl-auto=update

resilience4j.circuitbreaker.instances.question-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.question-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.question-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.question-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.question-service.permitted-number-of-calls-in-half-open-state=3

gateway.internal-secret=${INTERNAL_SECRET}
